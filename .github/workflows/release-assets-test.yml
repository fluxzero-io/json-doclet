name: Maven release assets

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/release-assets-test.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/release-assets-test.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s .github/scripts -p 'test*.py'
