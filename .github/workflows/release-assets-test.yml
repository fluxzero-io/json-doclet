name: Maven release assets

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/release-assets-test.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/release-assets-test.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s .github/scripts -p 'test*.py'

  artifact-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - name: Create representative publication files
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          root = Path('artifact-input')
          root.mkdir()
          (root / 'doclet.jar').write_bytes(bytes(range(256)) * 8)
          (root / 'doclet.pom').write_text('<project>roundtrip</project>')
          (root / 'doclet.jar.asc').write_text('signature fixture')
          (root / 'manifest.json').write_text('{"fixture": true}')
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-roundtrip
          path: artifact-input/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication-roundtrip
          path: artifact-output
      - name: Verify filenames and exact bytes after transport
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          source, target = Path('artifact-input'), Path('artifact-output')
          expected = {p.relative_to(source) for p in source.rglob('*') if p.is_file()}
          actual = {p.relative_to(target) for p in target.rglob('*') if p.is_file()}
          assert actual == expected, (actual, expected)
          for name in expected:
              assert (source / name).read_bytes() == (target / name).read_bytes(), name
          PYCODE
