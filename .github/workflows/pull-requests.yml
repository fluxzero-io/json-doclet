name: Verify pull requests

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: doclet-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set release timestamp
        run: echo "RELEASE_TIMESTAMP=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Test release failure boundaries
        run: python3 -m unittest discover -s .github/scripts -p 'test*.py'
      - name: Build, test and qualify signed publication without live uploads
        run: bash .github/scripts/qualify-release.sh
